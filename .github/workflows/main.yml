
name: Build DeathDimension

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Find and Build Plugin
        id: build
        shell: bash
        run: |
          POM=$(find . -name pom.xml \
            -not -path '*/.git/*' | head -n 1)

          if [ -z "$POM" ]; then
            echo "ERROR: pom.xml tidak ditemukan!"
            exit 1
          fi

          DIR=$(dirname "$POM")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

          mvn -B -f "$POM" clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: DeathDimension-JAR
          path: ${{ steps.build.outputs.dir }}/target/*.jar
          if-no-files-found: error
